<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>큰애기클럽 관리</title>
<meta name="theme-color" content="#1d6b3f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="큰애기클럽">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: friendly club-house tool for older officers — big, plain, calm.
   IDEA: the paper scorecard and starter's board at a park-golf course.
   PICTURE: the working board itself — attendance list, group cards, scorecard grid.
   COLOUR and TYPE: fairway green field, white card stock, flag-yellow accent; Noto Sans KR 900/600/400.
   LAYOUT: green header band with month rail, sticky tabs, one calm column of cards (max 960px). */
:root{color-scheme:light dark;
--bg:light-dark(#f4f7f2,#0f1712);--card:light-dark(#fff,#18241c);--ink:light-dark(#14211a,#e6eee8);--mute:light-dark(#5b6b61,#93a69a);
--line:light-dark(#dfe7e0,#2a3a2f);--g:#1d6b3f;--g2:light-dark(#e3f1e7,#1f3a29);--y:#f5c518;--m:#2f6fd6;--f:#d6457a;--bad:#c0392b}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
header{background:var(--g);color:#fff;padding:18px max(4vw,14px) 12px}
.hd{display:flex;align-items:center;gap:12px;max-width:960px;margin:0 auto}
.hd h1{font-size:clamp(24px,5vw,32px);font-weight:900;line-height:1.05;margin:0;flex:1}
.hd select{background:#ffffff22;border:1px solid #ffffff55;color:#fff;border-radius:10px;padding:8px 10px;min-height:44px}
.hd select option{color:#000}
.rail{display:flex;gap:6px;overflow-x:auto;max-width:960px;margin:12px auto 0;padding-bottom:4px;scrollbar-width:none}
.rail button{flex:none;min-width:54px;min-height:44px;border-radius:12px;border:0;background:#ffffff1f;color:#fff;font-weight:600;position:relative}
.rail button.on{background:#fff;color:var(--g);font-weight:800}
.rail button i{position:absolute;right:7px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--y)}
nav{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
nav div{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));max-width:960px;margin:0 auto}
nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px;text-decoration:none;color:var(--mute);font-weight:600;font-size:15px;border-bottom:3px solid transparent}
nav a svg{width:22px;height:22px}
nav a.on{color:var(--g);border-color:var(--g)}
:root[data-theme=dark] nav a.on,:root:not([data-theme=light]) nav a.on{color:light-dark(var(--g),#7fd39d);border-color:light-dark(var(--g),#7fd39d)}
main{max-width:960px;margin:0 auto;padding:16px max(4vw,12px) 90px}
h2{font-size:24px;line-height:1.2;margin:4px 0 12px;font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat b{display:block;font-size:30px;font-weight:900;line-height:1.1}
.stat span{color:var(--mute);font-size:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.bar .grow{flex:1 1 180px}
input[type=search],input[type=text],input[type=tel],input[type=month],select.f,textarea{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);font-size:17px}
.btn{min-height:48px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700}
.btn.pri{background:var(--g);color:#fff;border-color:var(--g)}
.btn.acc{background:var(--y);color:#2a2200;border-color:var(--y)}
.btn.sm{min-height:40px;padding:0 12px;font-size:15px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:none;min-height:44px;padding:0 14px;font-weight:600}
.seg button.on{background:var(--g);color:#fff}
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-height:60px}
.row .nm{font-weight:800;font-size:18px}
.row .sub{color:var(--mute);font-size:14px}
.row .main{flex:1}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:1px}
.dot.m{background:var(--m)}.dot.f{background:var(--f)}
.tog{display:flex;gap:6px}
.tog button{min-width:64px;min-height:46px;border-radius:12px;border:1px solid var(--line);background:none;font-weight:700;color:var(--mute)}
.tog .yes.on{background:var(--g);border-color:var(--g);color:#fff}
.tog .no.on{background:light-dark(#eef0ee,#2a332d);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.grp h3{margin:0 0 8px;font-size:20px;font-weight:900;display:flex;justify-content:space-between;align-items:baseline}
.grp h3 small{font-size:13px;color:var(--mute);font-weight:600}
.grp button.p{display:flex;align-items:center;width:100%;text-align:left;min-height:44px;border:0;border-radius:10px;background:var(--g2);margin-top:6px;padding:0 10px;font-weight:700}
.grp button.p.sel{background:var(--y);color:#2a2200}
.msg{padding:14px;border-radius:12px;background:light-dark(#fff6d6,#3a3214);margin-bottom:12px}
.msg.err{background:light-dark(#fde8e6,#3d1c18)}
.empty{text-align:center;color:var(--mute);padding:36px 12px}
.rk{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:var(--g2)}
.rk.r1{background:var(--y);color:#2a2200}.rk.r2{background:#d5dbe0;color:#222}.rk.r3{background:#e7b98c;color:#3a2108}
.num{font-size:24px;font-weight:900;text-align:right;white-space:nowrap}
.num small{font-size:13px;color:var(--mute);font-weight:600;display:block}
.gh{font-weight:800;color:var(--mute);margin:12px 2px 2px;font-size:15px}
dialog{border:0;border-radius:20px;padding:0;width:min(620px,96vw);max-height:92vh;background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0008}
.dh{position:sticky;top:0;background:var(--card);padding:16px 16px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.dh h3{margin:0;flex:1;font-size:22px}
.db{padding:14px 16px 18px}
.db label{display:block;font-weight:700;margin:12px 0 6px;font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sc{display:grid;grid-template-columns:42px repeat(9,minmax(0,1fr)) 46px;gap:4px;align-items:center;margin:8px 0}
.sc .h{font-size:12px;color:var(--mute);text-align:center;line-height:1.2}
.sc .h b{display:block;font-size:14px;color:var(--ink)}
.sc input{width:100%;height:46px;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:18px;font-weight:800;padding:0}
.sc input.un{color:var(--m)}.sc input.ov{color:var(--bad)}
.sc .t{font-weight:900;text-align:center;font-size:18px}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-top:1px solid var(--line);margin-top:8px}
.tot b{font-size:34px;font-weight:900}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#14211a;color:#fff;padding:12px 18px;border-radius:12px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.note{font-size:14px;color:var(--mute)}
details summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.pill{display:inline-block;font-size:13px;padding:2px 8px;border-radius:99px;background:var(--g2);font-weight:700;margin-left:6px;vertical-align:2px}
.pill.out{background:light-dark(#eee,#333);color:var(--mute)}
@media(max-width:600px){.sc{grid-template-columns:34px repeat(9,minmax(0,1fr)) 38px;gap:3px}.sc input{height:42px;font-size:17px}nav a{font-size:13px}.row .nm{font-size:17px}}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<header>
  <div class="hd">
    <svg width="38" height="38" viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="20" cy="35" rx="15" ry="4" fill="#0e4a29"/><rect x="18.5" y="5" width="3" height="30" rx="1.5" fill="#fff"/><path d="M21.5 5 L35 10.5 L21.5 16Z" fill="#f5c518"/><circle cx="12" cy="33" r="3" fill="#fff"/></svg>
    <h1 id="club">큰애기클럽</h1>
    <select id="year" aria-label="연도"></select>
  </div>
  <div class="rail" id="rail" role="tablist" aria-label="월 선택"></div>
</header>
<nav><div id="tabs">
  <a href="#attend" data-t="attend"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12l5 5L20 6"/></svg>참가</a>
  <a href="#groups" data-t="groups"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="8" height="7" rx="2"/><rect x="13" y="4" width="8" height="7" rx="2"/><rect x="3" y="13" width="8" height="7" rx="2"/><rect x="13" y="13" width="8" height="7" rx="2"/></svg>조편성</a>
  <a href="#scores" data-t="scores"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 21V4l11 4-11 4"/></svg>스코어</a>
  <a href="#ranks" data-t="ranks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/></svg>순위</a>
  <a href="#members" data-t="members"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 4a4 4 0 0 1 0 8M22 21c0-3-1.5-5-4-5.6"/></svg>회원</a>
</div></nav>
<main id="view"><div class="empty">불러오는 중…</div></main>
<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ROLES=['회원','회장','남부회장','여부회장','총무','회계','감사','경기이사','대외이사','홍보부장','이사'];
const METHODS=['남녀 균형','전체 무작위','남녀 분리','남자만','여자만'];
const DEF_PARS=[4,5,4,4,3,3,4,3,3,3,3,4,4,4,4,5,3,3];
const now=new Date();
const S={year:now.getFullYear(),month:now.getMonth()+1,tab:'attend',members:{},months:{},meta:{},draft:null,sel:null,q:'',rf:'전체',rm:'month',mf:'활동',method:'남녀 균형',ok:false,err:''};
let db=true,dl=true,toastT;const KEY='kbclub-v1';
function persist(){try{localStorage.setItem(KEY,JSON.stringify({members:S.members,months:S.months,meta:S.meta,saved:Date.now()}))}catch(e){toast('저장 공간이 부족해요. 엑셀 백업 후 정리해 주세요')}}
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2200)};
const mkey=(y,m)=>y+'-'+String(m).padStart(2,'0');
const cur=()=>S.months[mkey(S.year,S.month)]||{};
const pars=()=>Array.isArray(S.meta.pars)&&S.meta.pars.length===18?S.meta.pars:DEF_PARS;
const mem=id=>S.members[id];
const byName=(a,b)=>(a.name||'').localeCompare(b.name||'','ko')||a.id.localeCompare(b.id);
const active=()=>Object.values(S.members).filter(m=>m.status!=='탈퇴').sort(byName);
const sexDot=s=>`<span class="dot ${s==='남'?'m':'f'}"></span>`;
function total(e){if(!e)return null;const h=e.holes||[];if(h.length===18&&h.every(v=>typeof v==='number'&&v>0))return h.reduce((a,b)=>a+b,0);
  if(e.fb&&typeof e.fb[0]==='number'&&typeof e.fb[1]==='number')return e.fb[0]+e.fb[1];return null}
function rankList(rows){rows.sort((a,b)=>a.v-b.v||byName(a.m,b.m));let r=0;rows.forEach((x,i)=>{if(i===0||x.v!==rows[i-1].v)r=i+1;x.r=r});return rows}
function monthRanks(key,sex){const sc=(S.months[key]||{}).scores||{};const rows=[];
  for(const id in sc){const v=total(sc[id]),m=mem(id);if(v==null||!m)continue;if(sex&&m.sex!==sex)continue;rows.push({m,v})}return rankList(rows)}
function annual(sex,yr){const Y=yr||S.year,acc={};for(let mo=1;mo<=12;mo++){const sc=(S.months[mkey(Y,mo)]||{}).scores||{};
  for(const id in sc){const v=total(sc[id]);if(v==null)continue;(acc[id]=acc[id]||[]).push(v)}}
  const rows=[];for(const id in acc){const m=mem(id);if(!m||(sex&&m.sex!==sex))continue;const a=acc[id];rows.push({m,v:Math.round(a.reduce((x,y)=>x+y,0)/a.length*10)/10,n:a.length})}return rankList(rows)}

/* ---------- writes (one at a time per doc) ---------- */
const queues={};
function wq(path,fn){const p=(queues[path]||Promise.resolve()).then(fn).catch(e=>{console.warn(e);toast(e&&e.code==='invalid_argument'?'저장 권한이 없어요':'저장하지 못했어요. 다시 시도해 주세요')});queues[path]=p;return p}
function patchMonth(patch){const key=mkey(S.year,S.month);S.months[key]=deepMerge(S.months[key]||{},patch);persist();render()}
function deepMerge(a,b){const o=Array.isArray(a)?a.slice():{...a};for(const k in b){const v=b[k];o[k]=v&&typeof v==='object'&&!Array.isArray(v)&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k])?deepMerge(a[k],v):v}return o}
function saveMember(m){S.members[m.id]=m;persist();render()}
function saveMeta(){persist()}

/* ---------- header ---------- */
function allYears(){const ys=new Set([S.year,now.getFullYear(),...(S.meta.years||[])]);Object.keys(S.months).forEach(k=>ys.add(+k.slice(0,4)));return [...ys].filter(Boolean).sort((a,b)=>a-b)}
function openYearAdd(){const ys=allYears(),def=Math.max(...ys)+1,D=$('#dlg');
  D.innerHTML=`<div class="dh"><h3>연도 추가</h3><button class="btn sm" data-x>닫기</button></div><form class="db" id="yf">
  <p class="note" style="margin-top:0">회원 명부는 모든 연도에 그대로 이어져요. 새 연도에는 참가·조편성·스코어가 빈 상태로 시작하고, 기존 연도 기록은 그대로 남아요.</p>
  <label for="yn">추가할 연도</label><input type="text" inputmode="numeric" id="yn" value="${def}" maxlength="4">
  <div class="bar" style="margin-top:16px"><button class="btn pri grow" type="submit">추가</button></div></form>`;
  D.querySelector('[data-x]').onclick=()=>D.close();
  $('#yf').onsubmit=e=>{e.preventDefault();const y=parseInt($('#yn').value);if(!(y>=2000&&y<=2100)){toast('2000~2100 사이 연도를 넣어 주세요');return}
    S.meta.years=[...new Set([...(S.meta.years||[]),...ys,y])].sort((a,b)=>a-b);S.year=y;S.month=1;S.draft=null;persist();D.close();render();toast(`${y}년을 추가했어요`)};
  D.showModal();$('#yn').select()}
function renderHead(){
  $('#club').textContent=S.meta.name||'큰애기클럽';
  $('#year').innerHTML=allYears().map(y=>`<option value="${y}" ${y===S.year?'selected':''}>${y}년</option>`).join('')+'<option value="add">＋ 연도 추가</option>';
  $('#rail').innerHTML=Array.from({length:12},(_,i)=>{const k=mkey(S.year,i+1),d=S.months[k],has=d&&(Object.keys(d.scores||{}).length||Object.values(d.att||{}).some(v=>v==='참여'));
    return `<button role="tab" data-m="${i+1}" class="${S.month===i+1?'on':''}" aria-selected="${S.month===i+1}">${i+1}월${has?'<i></i>':''}</button>`}).join('');
  document.querySelectorAll('#tabs a').forEach(a=>a.classList.toggle('on',a.dataset.t===S.tab));
}
function render(){renderHead();const v=$('#view');
  if(!S.ok){v.innerHTML=`<div class="msg ${S.err?'err':''}">${S.err||'불러오는 중…'}</div>`;return}
  v.innerHTML={attend:vAttend,groups:vGroups,scores:vScores,ranks:vRanks,members:vMembers}[S.tab]();}

/* ---------- 참가 ---------- */
function vAttend(){const att=cur().att||{},list=active();
  const yes=list.filter(m=>att[m.id]==='참여'),nm=yes.filter(m=>m.sex==='남').length;
  const q=S.q.trim(),shown=q?list.filter(m=>m.name.includes(q)):list;
  return `<h2>${S.month}월 경기 참가</h2>
  <div class="stats"><div class="card stat"><b>${yes.length}명</b><span>참여 (남 ${nm} · 여 ${yes.length-nm})</span></div>
  <div class="card stat"><b>${groupCountText(yes.length)}</b><span>예상 조 수</span></div>
  <div class="card stat"><b>${list.length-yes.length-list.filter(m=>att[m.id]==='불참').length}명</b><span>아직 미정</span></div></div>
  <div class="bar"><input class="grow" type="search" id="q" placeholder="이름 검색" value="${esc(S.q)}">
  <button class="btn sm" data-act="restNo">미정은 모두 불참</button><button class="btn sm" data-act="newM">+ 신입 회원</button></div>
  <div class="list">${shown.map(m=>`<div class="row"><div class="main"><div class="nm">${sexDot(m.sex)}${esc(m.name)}${m.role&&m.role!=='회원'?`<span class="pill">${esc(m.role)}</span>`:''}</div><div class="sub">${m.id}</div></div>
   <div class="tog"><button class="yes ${att[m.id]==='참여'?'on':''}" data-att="${m.id}" data-v="참여" aria-pressed="${att[m.id]==='참여'}">참여</button><button class="no ${att[m.id]==='불참'?'on':''}" data-att="${m.id}" data-v="불참" aria-pressed="${att[m.id]==='불참'}">불참</button></div></div>`).join('')||'<div class="empty">검색 결과가 없어요</div>'}</div>
  <p class="note">버튼을 다시 누르면 선택이 취소돼요. 탈퇴 회원은 목록에 나오지 않아요.</p>`}
function groupCountText(n){if(!n)return '0조';const t=(4-n%4)%4,f=(n-3*t)/4;return n<3||f<0?'편성 불가':(t+f)+'조'}

/* ---------- 조편성 ---------- */
const valid=n=>n===0||(n>=3&&n!==5);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function sizes(n){const t=(4-n%4)%4,f=(n-3*t)/4;return Array(f).fill(4).concat(Array(t).fill(3))}
function make(list){const x=shuffle(list),out=[];let i=0;for(const s of sizes(x.length)){out.push(x.slice(i,i+s));i+=s}return out}
function balanced(list){const M=shuffle(list.filter(m=>m.sex==='남')),F=shuffle(list.filter(m=>m.sex!=='남')),n=list.length,out=[];let st=0,mi=0,fi=0;
  for(const sz of sizes(n)){const mb=Math.round(st*M.length/n),mq=Math.round((st+sz)*M.length/n)-mb,g=[];
    for(let k=0;k<mq;k++)g.push(M[mi++]);for(let k=0;k<sz-mq;k++)g.push(F[fi++]);out.push(g.filter(Boolean));st+=sz}return out}

async function saveFile(name,blob){const f=new File([blob],name,{type:blob.type});
  if(/iPhone|iPad|Android/i.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});return}catch(e){if(e.name==='AbortError')return}}

  const gs={};rows(X,wb,'조편성').slice(1).forEach(r=>{const y=YR(r),mo=parseInt(str(r[o])),g=parseInt(str(r[o+1])),id=str(r[o+2]);if(y&&mo&&g&&members[id]){const k=mkey(y,mo);gs[k]=gs[k]||{};(gs[k][g]=gs[k][g]||[]).push(id)}});
